<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>帧数据编辑器</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #1b1d22; color: #ddd; font: 14px/1.5 "Microsoft YaHei", sans-serif; }
  header { padding: 10px 16px; background: #23262d; border-bottom: 1px solid #333; display: flex; gap: 12px; align-items: center; }
  header h1 { font-size: 16px; margin: 0; }
  main { display: grid; grid-template-columns: 180px 1fr; gap: 10px; padding: 10px; }
  #move-list { list-style: none; margin: 0; padding: 0; }
  #move-list li { padding: 6px 10px; cursor: pointer; border-radius: 4px; }
  #move-list li:hover { background: #2a2e36; }
  #move-list li.selected { background: #34518a; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .btn { background: #2f333c; color: #ddd; border: 1px solid #444; border-radius: 4px; padding: 4px 10px; cursor: pointer; }
  .btn:hover { background: #3a3f4a; }
  .btn.active { background: #34518a; border-color: #4a6cb3; }
  .btn.primary { background: #34518a; margin: 6px 0; }
  canvas#stage { background: #24272e; border: 1px solid #333; border-radius: 4px; display: block; }
  canvas#timeline { background: #20232a; border: 1px solid #333; border-radius: 4px; margin-top: 6px; }
  .tabs { display: flex; gap: 4px; margin-top: 12px; border-bottom: 1px solid #333; }
  .tab { padding: 6px 14px; cursor: pointer; border: 1px solid transparent; border-radius: 4px 4px 0 0; }
  .tab.active { background: #23262d; border-color: #333; border-bottom-color: #23262d; }
  .tab-page { display: none; padding: 12px; background: #23262d; border-radius: 0 0 4px 4px; }
  .tab-page.active { display: block; }
  .data-table { border-collapse: collapse; width: 100%; }
  .data-table th, .data-table td { border: 1px solid #3a3e47; padding: 4px 6px; text-align: left; }
  .data-table th { background: #2a2e36; }
  .row-selected { background: #2c3548; }
  .cell-input { width: 56px; background: #1b1d22; color: #ddd; border: 1px solid #444; border-radius: 3px; padding: 2px 4px; }
  .cell-input.tiny { width: 44px; }
  .cell-input.cmd { width: 80px; }
  .adv-pos { color: #6fd68a; }
  .adv-neg { color: #e06c6c; }
  .row { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
  .row.wrap { flex-wrap: wrap; }
  .chk { display: flex; gap: 4px; align-items: center; }
  .panel-out { margin-top: 8px; }
  .good { color: #6fd68a; }
  .bad { color: #e06c6c; }
  .dim { color: #888; }
  .big { font-size: 16px; font-weight: bold; margin-bottom: 6px; }
  .mono { font-family: Consolas, monospace; }
  .dpad { display: grid; grid-template-columns: repeat(3, 40px); gap: 4px; margin: 8px 0; }
  .dir-btn { width: 40px; height: 36px; background: #2f333c; color: #ddd; border: 1px solid #444; border-radius: 4px; cursor: pointer; }
  .dir-btn:hover { background: #3a4f8a; }
  select { background: #1b1d22; color: #ddd; border: 1px solid #444; border-radius: 3px; padding: 3px 6px; }
  textarea#json-io { width: 100%; height: 120px; background: #1b1d22; color: #ccc; border: 1px solid #444; border-radius: 4px; font-family: Consolas, monospace; }
  h3 { margin: 4px 0 8px; font-size: 14px; }
</style>
</head>
<body>
<header>
  <h1>帧数据编辑器 — 阿岚</h1>
  <button class="btn" id="export">导出 JSON</button>
  <button class="btn" id="import">导入 JSON</button>
</header>
<main>
  <aside>
    <h3>招式</h3>
    <ul id="move-list"></ul>
  </aside>
  <section>
    <div class="toolbar">
      <button class="btn active" id="mode-select">选择/移动</button>
      <button class="btn" id="mode-hit">画攻击框</button>
      <button class="btn" id="mode-hurt">画受击框</button>
      <button class="btn" id="flip">翻转朝向</button>
      <span class="dim">Delete 删除选中的框;时间轴点击切换帧;紫框 = 取消窗口</span>
    </div>
    <canvas id="stage" width="560" height="360"></canvas>
    <canvas id="timeline" width="560" height="64"></canvas>

    <div class="tabs">
      <div class="tab active" data-page="page-table">数据表</div>
      <div class="tab" data-page="page-advantage">有利帧</div>
      <div class="tab" data-page="page-cancel">取消设置</div>
      <div class="tab" data-page="page-input">输入缓冲</div>
      <div class="tab" data-page="page-combo">连段验证器</div>
      <div class="tab" data-page="page-json">JSON</div>
    </div>
    <div class="tab-page active" id="page-table"><div id="table-root"></div></div>
    <div class="tab-page" id="page-advantage"><div id="panel-advantage"></div></div>
    <div class="tab-page" id="page-cancel"><div id="panel-cancel"></div></div>
    <div class="tab-page" id="page-input"><div id="panel-input"></div></div>
    <div class="tab-page" id="page-combo"><div id="panel-combo"></div></div>
    <div class="tab-page" id="page-json"><textarea id="json-io"></textarea></div>
  </section>
</main>
<script type="module" src="./dist/main.js"></script>
</body>
</html>
